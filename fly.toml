# fly.toml app configuration file

app = "library-ai-chatbot"
primary_region = "fra"

[build]

[processes]
  app = "uvicorn api.main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1