providers = ["python"]

[phases.setup]
nixPkgs = [
  "python311",  
  "gcc",
  "libxml2",
  "libxslt",
  "sqlite",
  "pkg-config"
]
aptPkgs = [
  "libnss3", 
  "libasound2t64", 
  "libgbm1"
]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt && pip install playwright && /opt/venv/bin/python -m playwright install chromium && /opt/venv/bin/python -m playwright install-deps chromium"
]

[phases.start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"