providers = ["python"]

[phases.setup]
nixPkgs = [
  "python311",  
  "gcc",
  "libxml2",
  "libxslt",
  "sqlite",
  "pkg-config"
]
aptPkgs = ["chromium", "chromium-driver", "libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libdrm2", "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxrandr2", "libgbm1", "libpango-1.0-0", "libcairo2", "asound2"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt && pip install playwright && /opt/venv/bin/python -m playwright install chromium && /opt/venv/bin/python -m playwright install-deps chromium"
]
[phases.start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"